<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM - Employee Login</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0f2027;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #161623;
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 { color: #deff9a; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #333;
            background: #222831;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #deff9a;
            border: none;
            color: black;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 15px;
            transition: 0.3s;
        }
        button:hover { background: #bada78; }
        .msg { margin-top: 15px; font-weight: bold; }
        .back-link { margin-top: 20px; font-size: 14px; }
        .back-link a { color: #deff9a; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Employee Login</h2>
        <form id="empLoginForm">
            <input type="email" id="email" placeholder="Employee Email ID" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login to Dashboard</button>
        </form>
        <p id="msg" class="msg"></p>
        <div class="back-link">
            Are you an Admin? <a href="/login.html">Admin Login</a>
        </div>
    </div>

    <script>
        document.getElementById('empLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgP = document.getElementById('msg');

            try {
                const res = await fetch('/api/employees/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if(res.ok) {
                    msgP.style.color = '#4e9f3d';
                    msgP.innerText = "🎉 Login Successful! Redirecting...";
                    
                    // Employee ka token aur data alag keys mein save karenge
                    localStorage.setItem('empToken', data.token);
                    localStorage.setItem('empInfo', JSON.stringify(data.employee));
                    
                    setTimeout(() => {
                        window.location.href = '/emp-dashboard.html';
                    }, 1200);
                } else {
                    msgP.style.color = '#ff4a4a';
                    msgP.innerText = "❌ " + data.message;
                }
            } catch(err) {
                msgP.style.color = '#ff4a4a';
                msgP.innerText = "❌ Server error!";
            }
        });
    </script>
</body>
</html>
