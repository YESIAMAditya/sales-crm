<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee CRM Dialer</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a24;
            --text-color: #ffffff;
            --border-color: #2d2d3f;
            --input-bg: #22252e;
            --accent-color: #deff9a;
            --accent-text: #000000;
        }

        [data-theme="light"] {
            --bg-color: #f4f5f8;
            --card-bg: #ffffff;
            --text-color: #1e1e24;
            --border-color: #e2e8f0;
            --input-bg: #f8fafc;
            --accent-color: #4f46e5;
            --accent-text: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            padding-bottom: 60px; 
        }

        .nav { 
            background: var(--card-bg); 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 3px solid var(--accent-color); 
            position: sticky; 
            top: 0; 
            z-index: 100;
        }

        .container { padding: 15px; max-width: 1400px; margin: 0 auto; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }

        select, input { 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid var(--border-color); 
            background: var(--input-bg); 
            color: var(--text-color); 
            width: 100%; 
            font-size: 15px;
        }

        .btn { 
            padding: 10px 16px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
        }

        .action-btn { background: var(--accent-color); color: var(--accent-text); }
        .danger-btn { background: #ff4a4a; color: white; }

        .call-link { 
            background: #22c55e; 
            color: white; 
            padding: 8px 14px; 
            border-radius: 6px; 
            text-decoration: none; 
            font-weight: bold; 
        }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border-color); text-align: left; }
        th { background: #252538; }

        .tabs-wrapper { 
            display: flex; 
            overflow-x: auto; 
            margin: 15px 0; 
            gap: 5px;
        }
        .tab-btn { 
            padding: 12px 16px; 
            border: none; 
            border-radius: 8px 8px 0 0; 
            font-weight: bold; 
            white-space: nowrap; 
            flex-shrink: 0;
        }
        .tab-btn.active { 
            background: var(--accent-color); 
            color: var(--accent-text); 
        }

        @media (max-width: 768px) {
            tr { 
                display: block; 
                margin-bottom: 12px; 
                border: 1px solid var(--border-color); 
                border-radius: 8px; 
                padding: 10px; 
            }
            td { 
                display: flex; 
                justify-content: space-between; 
                padding: 8px 0; 
            }
            td::before { 
                content: attr(data-label); 
                font-weight: bold; 
                margin-right: 10px; 
            }
        }
    </style>
</head>
<body>

    <div class="nav">
        <h2>CRM Dialer</h2>
        <div>
            <span id="empName" style="font-weight:bold; margin-right:15px;"></span>
            <button class="btn" id="themeToggleBtn" onclick="toggleTheme()">☀️ Light</button>
            <span onclick="logout()" style="color:#ff4a4a; margin-left:15px; cursor:pointer; font-weight:bold;">Logout</span>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h3>📁 My Assigned Sheets</h3>
            <select id="excelDocSelect" onchange="loadExcelToDashboard()">
                <option value="">-- Select Sheet --</option>
            </select>
        </div>

        <div id="dataBoard" style="display:none;">
            <input type="text" id="leadSearchInput" placeholder="🔍 Search by Name or Phone..." 
                   oninput="renderTable()" style="margin-bottom:12px;">

            <div class="tabs-wrapper">
                <button class="tab-btn active" id="tab-pending" onclick="switchTab('pending')">Pending (<span id="count-pending">0</span>)</button>
                <button class="tab-btn" id="tab-followup" onclick="switchTab('followup')">Follow-up (<span id="count-followup">0</span>)</button>
                <button class="tab-btn" id="tab-interested" onclick="switchTab('interested')">Interested (<span id="count-interested">0</span>)</button>
                <button class="tab-btn" id="tab-archived" onclick="switchTab('archived')">Done (<span id="count-archived">0</span>)</button>
            </div>

            <div class="card">
                <div style="overflow-x:auto;">
                    <table id="excelTable">
                        <thead id="tableHeader"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script>
// ====================== EMPLOYEE CONFIG ======================
const rawData = localStorage.getItem('empInfo') || localStorage.getItem('employeeInfo');
const empInfo = rawData ? JSON.parse(rawData) : null;

if (!empInfo) {
    alert("Session expired! Please login again.");
    window.location.href = '/emp-login.html';
}

// Safe Employee ID
const employeeId = empInfo._id || empInfo.id;
if (!employeeId) {
    alert("Employee ID not found!");
    window.location.href = '/emp-login.html';
}

let currentDocId = null;
let currentTab = 'pending';
let fullExcelData = [];
let historyMap = {};
let loadedDocumentCache = {};

// ====================== INIT ======================
window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('empName').textContent = empInfo.name || "Sales Executive";
    initTheme();
    fetchMyAssignedSheets();
});

function initTheme() {
    const saved = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeToggleBtn').textContent = saved === 'light' ? '🌙 Dark' : '☀️ Light';
}

function toggleTheme() {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    const newTheme = isLight ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    document.getElementById('themeToggleBtn').textContent = newTheme === 'light' ? '🌙 Dark' : '☀️ Light';
}

// ====================== FETCH ASSIGNED SHEETS ======================
async function fetchMyAssignedSheets() {
    try {
        const res = await fetch(`/api/documents/my-leads/${employeeId}`);
        const leads = await res.json();

        const sheetMap = {};
        leads.forEach(lead => {
            if (lead.documentId) {
                const doc = lead.documentId;
                if (!sheetMap[doc._id]) {
                    sheetMap[doc._id] = {
                        _id: doc._id,
                        fileName: doc.fileName || 'Unnamed Sheet'
                    };
                }
            }
        });

        renderSheetDropdown(Object.values(sheetMap));
    } catch (err) {
        console.error(err);
    }
}

function renderSheetDropdown(sheets) {
    const select = document.getElementById('excelDocSelect');
    select.innerHTML = '<option value="">-- Select Sheet --</option>';

    sheets.forEach(sheet => {
        select.innerHTML += `<option value="${sheet._id}">${sheet.fileName}</option>`;
    });
}

// ====================== LOAD SHEET DATA ======================
async function loadExcelToDashboard() {
    currentDocId = document.getElementById('excelDocSelect').value;
    if (!currentDocId) {
        document.getElementById('dataBoard').style.display = 'none';
        return;
    }

    document.getElementById('dataBoard').style.display = 'block';

    if (loadedDocumentCache[currentDocId]) {
        fullExcelData = loadedDocumentCache[currentDocId].data;
        historyMap = loadedDocumentCache[currentDocId].history;
        renderTable();
        return;
    }

    try {
        const res = await fetch(`/api/documents/read-excel/${currentDocId}`);
        const result = await res.json();

        fullExcelData = result.savedStatuses || [];
        historyMap = {};

        fullExcelData.forEach(item => {
            if (item.customerPhone) {
                historyMap[String(item.customerPhone).trim()] = item;
            }
        });

        loadedDocumentCache[currentDocId] = { data: fullExcelData, history: historyMap };

        renderTable();
    } catch (err) {
        console.error(err);
        alert("Failed to load sheet data");
    }
}

// ====================== RENDER TABLE ======================
function renderTable() {
    const tbody = document.getElementById('tableBody');
    const search = document.getElementById('leadSearchInput').value.toLowerCase().trim();
    tbody.innerHTML = '';

    let counts = { pending: 0, followup: 0, interested: 0, archived: 0 };

    fullExcelData.forEach((lead, index) => {
        const phone = String(lead.customerPhone || '').trim();
        const name = lead.customerName || 'N/A';

        if (search && !name.toLowerCase().includes(search) && !phone.includes(search)) return;

        const history = historyMap[phone];
        const status = history ? history.status : 'New';

        let tabType = 'pending';
        if (status === 'Follow-up') tabType = 'followup';
        else if (status === 'Interested') tabType = 'interested';
        else if (status === 'Rejected' || status === 'Ringing') tabType = 'archived';

        counts[tabType]++;

        if (currentTab !== tabType) return;

        const row = document.createElement('tr');
        row.innerHTML = `
            <td data-label="Name">${name}</td>
            <td data-label="Phone">${phone}</td>
            <td data-label="Status">
                <select id="status-${index}">
                    <option value="Ringing" ${status==='Ringing'?'selected':''}>Ringing</option>
                    <option value="Interested" ${status==='Interested'?'selected':''}>Interested</option>
                    <option value="Follow-up" ${status==='Follow-up'?'selected':''}>Follow-up</option>
                    <option value="Rejected" ${status==='Rejected'?'selected':''}>Rejected</option>
                </select>
            </td>
            <td data-label="Remarks">
                <input type="text" id="remarks-${index}" value="${history?.remarks || ''}" placeholder="Add remarks...">
            </td>
            <td>
                <a href="tel:${phone}" class="call-link">📞 Call</a>
                <button class="btn action-btn" onclick="submitStatus(${index}, '${phone}', '${name.replace(/'/g,"\\'")}')">Save</button>
            </td>
        `;
        tbody.appendChild(row);
    });

    document.getElementById('count-pending').textContent = counts.pending;
    document.getElementById('count-followup').textContent = counts.followup;
    document.getElementById('count-interested').textContent = counts.interested;
    document.getElementById('count-archived').textContent = counts.archived;
}

// ====================== UPDATE STATUS ======================
async function submitStatus(index, phone, name) {
    const status = document.getElementById(`status-${index}`).value;
    const remarks = document.getElementById(`remarks-${index}`).value;

    try {
        const res = await fetch('/api/documents/update-status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                employeeId: employeeId,
                documentId: currentDocId,
                customerName: name,
                customerPhone: phone,
                status: status,
                remarks: remarks
            })
        });

        if (res.ok) {
            historyMap[phone] = { status, remarks };
            alert("✅ Status Updated Successfully!");
            renderTable();
        } else {
            alert("❌ Failed to update status");
        }
    } catch (err) {
        console.error(err);
        alert("Network error");
    }
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.id === `tab-${tab}`);
    });
    renderTable();
}

function logout() {
    if (confirm("Logout karna chahte hain?")) {
        localStorage.clear();
        window.location.href = '/emp-login.html';
    }
}
</script>
</body>
</html>
