<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Center</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent: #deff9a;
        }
        body.light-theme {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --accent: #2563eb;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; }
        .nav { background: var(--bg-card); padding: 18px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--accent); }
        .container { padding: 25px; max-width: 1450px; margin: 0 auto; }
        .card { background: var(--bg-card); padding: 22px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); margin-bottom: 25px; }

        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 25px; }
        .analytics-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .counter-card { background: var(--bg-card); padding: 18px; border-radius: 10px; text-align: center; border-left: 5px solid var(--accent); }

        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; }
        input, select { width: 100%; padding: 11px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: var(--accent); color: black; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-success { background: #22c55e; color: white; }

        .reports-controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; align-items: center; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background: #334155; color: var(--accent); }

        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="nav">
        <h2>Admin Master Control Center</h2>
        <div>
            <button onclick="toggleTheme()" id="themeBtn">☀️ Light Mode</button>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="analytics-container">
            <div class="counter-card"><h4>New</h4><div class="num" id="counterNew">0</div></div>
            <div class="counter-card"><h4>Ringing</h4><div class="num" id="counterRinging">0</div></div>
            <div class="counter-card"><h4>Interested</h4><div class="num" id="counterInterested">0</div></div>
            <div class="counter-card"><h4>Follow-up</h4><div class="num" id="counterFollowUp">0</div></div>
            <div class="counter-card"><h4>Rejected</h4><div class="num" id="counterRejected">0</div></div>
        </div>

        <div class="grid">
            <!-- Create Employee -->
            <div>
                <div class="card">
                    <h3>👤 Create New Employee</h3>
                    <form id="addEmpForm">
                        <div class="form-group"><label>Full Name</label><input type="text" id="empName" required></div>
                        <div class="form-group"><label>Email ID</label><input type="email" id="empEmail" required></div>
                        <div class="form-group"><label>Password</label><input type="password" id="empPass" required></div>
                        <button type="submit" class="btn btn-primary">Generate ID & Password</button>
                    </form>
                </div>

                <!-- Bulk Upload -->
                <div class="card">
                    <h3>📤 Upload & Assign Leads</h3>
                    <form id="uploadForm">
                        <div class="form-group"><label>Select Excel/CSV File</label><input type="file" id="myFile" accept=".xlsx,.xls,.csv" required></div>
                        <div class="form-group"><label>Assign To</label>
                            <select id="empSelect" onchange="handleAssignDropdown(this.value)" required></select>
                        </div>
                        <div class="splitter-box" id="splitterSection">
                            <label><strong>Select Team for Split:</strong></label>
                            <div id="splitterCheckboxesList"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Upload & Assign</button>
                    </form>
                </div>
            </div>

            <!-- Team Management -->
            <div class="card">
                <h3>👥 Team Management & Control</h3>
                <div class="table-container">
                    <table id="teamTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminEmpTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Live Reports -->
        <div class="card">
            <h3>📊 Live Team Performance & Updates</h3>
            
            <div class="reports-controls">
                <button class="btn" onclick="openArchiveModal()">🧹 Clean Workspace</button>
                <select id="reportEmpFilter" onchange="filterReports()"></select>
                <select id="reportStatusFilter" onchange="filterReports()">
                    <option value="All">All Status</option>
                    <option value="New">New</option>
                    <option value="Ringing">Ringing</option>
                    <option value="Interested">Interested</option>
                    <option value="Follow-up">Follow-up</option>
                    <option value="Rejected">Rejected</option>
                </select>
                <button class="btn btn-success" onclick="downloadReportExcel()">💾 Export Excel</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Employee</th>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Status</th>
                            <th>Remarks</th>
                            <th>Updated At</th>
                        </tr>
                    </thead>
                    <tbody id="adminReportTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
// ====================== CONFIG ======================
const adminInfo = JSON.parse(localStorage.getItem('adminInfo'));
if (!adminInfo) {
    alert("Please login first");
    window.location.href = '/admin-login.html';
}

let allReports = [];

// ====================== INIT ======================
document.addEventListener('DOMContentLoaded', () => {
    initTheme();
    initAdminDashboard();
    setInterval(fetchLiveReports, 4000);
});

// Theme
function initTheme() {
    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-theme');
    document.getElementById('themeBtn').innerText = document.body.classList.contains('light-theme') ? "🌙 Dark" : "☀️ Light";
}

function toggleTheme() {
    document.body.classList.toggle('light-theme');
    const isLight = document.body.classList.contains('light-theme');
    document.getElementById('themeBtn').innerText = isLight ? "🌙 Dark" : "☀️ Light";
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
}

// Load Employees + Reports
async function initAdminDashboard() {
    await loadAdminData();
    await fetchLiveReports();
}

// ... (baaki functions aapke purane code ke hisaab se improve kiye ja sakte hain)

</script>
</body>
</html>
